<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>代码实时染色平台</title>
<style>
  :root {
    --el-color-primary: #409eff;
    --el-color-primary-light-9: #ecf5ff;
    --el-color-success: #67c23a;
    --el-color-success-light-9: #f0f9eb;
    --el-color-warning: #e6a23c;
    --el-color-warning-light-9: #fdf6ec;
    --el-color-danger: #f56c6c;
    --el-color-danger-light-9: #fef0f0;
    --el-color-info: #909399;
    --el-text-color-primary: #303133;
    --el-text-color-regular: #606266;
    --el-text-color-secondary: #909399;
    --el-border-color: #dcdfe6;
    --el-border-color-lighter: #ebeef5;
    --el-bg-color: #fff;
    --el-bg-color-page: #f2f3f5;
    --el-fill-color-light: #f5f7fa;
    --radius: 4px;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    --sans: "Helvetica Neue", Helvetica, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --el-color-primary-light-9: #18222c;
      --el-color-success-light-9: #1c2518;
      --el-color-warning-light-9: #292218;
      --el-color-danger-light-9: #2b1d1d;
      --el-text-color-primary: #e5eaf3;
      --el-text-color-regular: #cfd3dc;
      --el-text-color-secondary: #a3a6ad;
      --el-border-color: #4c4d4f;
      --el-border-color-lighter: #363637;
      --el-bg-color: #141414;
      --el-bg-color-page: #0a0a0a;
      --el-fill-color-light: #262727;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--sans); font-size: 14px; color: var(--el-text-color-regular); background: var(--el-bg-color-page); }

  header {
    height: 56px; background: var(--el-bg-color); border-bottom: 1px solid var(--el-border-color-lighter);
    display: flex; align-items: center; gap: 14px; padding: 0 18px; position: sticky; top: 0; z-index: 10;
  }
  h1 { font-size: 16px; margin: 0; color: var(--el-text-color-primary); font-weight: 600; }
  .spacer { margin-left: auto; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px;
    border-radius: 12px; font-size: 12px; border: 1px solid;
  }
  .pill.ok { background: var(--el-color-success-light-9); border-color: var(--el-color-success); color: var(--el-color-success); }
  .pill.err { background: var(--el-color-danger-light-9); border-color: var(--el-color-danger); color: var(--el-color-danger); }
  .pill.warn { background: var(--el-color-warning-light-9); border-color: var(--el-color-warning); color: var(--el-color-warning); }
  .pill i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .pill.ok i { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .25 } }
  @media (prefers-reduced-motion: reduce) { .pill.ok i { animation: none } }

  button {
    height: 30px; padding: 0 14px; font-family: inherit; font-size: 13px;
    border: 1px solid var(--el-border-color); background: var(--el-bg-color);
    color: var(--el-text-color-regular); border-radius: var(--radius); cursor: pointer;
  }
  button:hover { color: var(--el-color-primary); border-color: var(--el-color-primary); }
  button.primary { background: var(--el-color-primary); border-color: var(--el-color-primary); color: #fff; }

  .seg { display: inline-flex; }
  .seg button { border-radius: 0; margin-left: -1px; }
  .seg button:first-child { border-radius: var(--radius) 0 0 var(--radius); margin-left: 0; }
  .seg button:last-child { border-radius: 0 var(--radius) var(--radius) 0; }
  .seg button.on { background: var(--el-color-primary); border-color: var(--el-color-primary); color: #fff; z-index: 1; }
  input, select {
    height: 30px; padding: 0 10px; width: 130px; font-family: var(--mono); font-size: 13px;
    border: 1px solid var(--el-border-color); border-radius: var(--radius);
    background: var(--el-bg-color); color: var(--el-text-color-regular);
  }
  select { width: auto; min-width: 150px; }

  /* 场景录制条：与实时视图分开，避免「正在录场景」这件事被淹没在工具栏里 */
  .bar {
    display: flex; align-items: center; gap: 10px; padding: 9px 18px; font-size: 13px;
    background: var(--el-bg-color); border-bottom: 1px solid var(--el-border-color-lighter);
    flex-wrap: wrap;
  }
  .bar label { color: var(--el-text-color-secondary); }
  .bar .rec { color: var(--el-color-danger); display: inline-flex; align-items: center; gap: 6px; }
  .bar .rec i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: pulse 1.6s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { .bar .rec i { animation: none } }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button:disabled:hover { color: var(--el-text-color-regular); border-color: var(--el-border-color); }

  main { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 14px; padding: 14px; align-items: start; }
  .card { background: var(--el-bg-color); border: 1px solid var(--el-border-color-lighter); border-radius: var(--radius); overflow: hidden; }
  .card-head { padding: 11px 14px; border-bottom: 1px solid var(--el-border-color-lighter); display: flex; align-items: center; gap: 8px; }
  .card-head h2 { font-size: 14px; margin: 0; color: var(--el-text-color-primary); font-weight: 600; }
  /* 说明文字长短由数据决定（口径 + 采样数 + 变化量），卡片头是 flex 且不换行，
     不设上限的话一条长说明就能把整张卡撑到容器之外 */
  .card-head .sub { font-size: 12px; color: var(--el-text-color-secondary); margin-left: auto; font-family: var(--mono); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .file { display: flex; align-items: center; gap: 8px; padding: 8px 14px; cursor: pointer; border: none; background: none; width: 100%; text-align: left; font-family: inherit; font-size: 13px; color: var(--el-text-color-regular); }
  .file:hover { background: var(--el-fill-color-light); }
  .file.on { background: var(--el-color-primary-light-9); color: var(--el-color-primary); }
  .file .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file .pc { margin-left: auto; font-family: var(--mono); font-size: 12px; flex: none; }
  .pc.s { color: var(--el-color-success); } .pc.w { color: var(--el-color-warning); } .pc.d { color: var(--el-color-danger); }

  .legend { display: flex; gap: 12px; padding: 9px 14px; background: var(--el-fill-color-light); border-bottom: 1px solid var(--el-border-color-lighter); font-size: 12px; color: var(--el-text-color-secondary); flex-wrap: wrap; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend i { width: 10px; height: 10px; border-radius: 2px; }

  .src { font-family: var(--mono); font-size: 13px; line-height: 21px; overflow-x: auto; max-height: calc(100vh - 210px); overflow-y: auto; }
  .ln { display: flex; white-space: pre; border-left: 3px solid transparent; }
  .ln.COVERED { background: var(--el-color-success-light-9); border-left-color: var(--el-color-success); }
  .ln.MISSED { background: var(--el-color-danger-light-9); border-left-color: var(--el-color-danger); }
  .ln.PARTIAL { background: var(--el-color-warning-light-9); border-left-color: var(--el-color-warning); }
  .ln.flash { animation: flash 1s ease-out; }
  @keyframes flash { from { background: var(--el-color-success); } to { } }
  @media (prefers-reduced-motion: reduce) { .ln.flash { animation: none } }
  /* 增量视图：基线之后没动过的行仍要显示以保留上下文，但不参与染色 */
  .ln.out { background: none; border-left-color: transparent; opacity: .35; }
  .ln .no { width: 52px; flex: none; text-align: right; padding-right: 14px; color: var(--el-text-color-secondary); opacity: .7; user-select: none; font-size: 12px; }
  .ln .tx { color: var(--el-text-color-primary); padding-right: 16px; }

  .empty { padding: 40px 20px; text-align: center; color: var(--el-text-color-secondary); }
  .err { margin: 14px; padding: 10px 14px; background: var(--el-color-danger-light-9); color: var(--el-color-danger); border-radius: var(--radius); font-size: 13px; }
  /* 数据不完整但可用：与「算不出结果」区分开，避免把降级当成故障 */
  .warn { margin: 14px; padding: 10px 14px; background: var(--el-color-warning-light-9); color: var(--el-color-warning); border-radius: var(--radius); font-size: 13px; }

  /* 看板与染色是两种看法，不并排铺开：源码视图是核心，不能被挤到折叠线以下 */
  .tabs { display: flex; padding: 0 18px; background: var(--el-bg-color); border-bottom: 1px solid var(--el-border-color-lighter); }
  .tabs button { border: none; background: none; height: 40px; padding: 0 16px; border-radius: 0; border-bottom: 2px solid transparent; }
  .tabs button:hover, .tabs button.on { color: var(--el-color-primary); border-bottom-color: var(--el-color-primary); }

  #viewDash { padding: 14px; display: grid; gap: 14px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(148px, 1fr)); gap: 14px; }
  .stat { background: var(--el-bg-color); border: 1px solid var(--el-border-color-lighter); border-radius: var(--radius); padding: 13px 14px; }
  .stat .k { font-size: 12px; color: var(--el-text-color-secondary); }
  .stat .v { font-size: 21px; font-family: var(--mono); color: var(--el-text-color-primary); margin-top: 5px; }
  .stat .v small { font-size: 13px; color: var(--el-text-color-secondary); }

  /* 门禁结论是三态而非两态：「判不了」必须与「不通过」分开显示 ——
     前者该找人看平台，后者该补测试，混成同一个红色就会把人指去错误的方向 */
  .gate { display: flex; align-items: center; gap: 14px; padding: 16px 18px; flex-wrap: wrap; }
  .gate .verdict { font-size: 18px; font-weight: 600; padding: 3px 14px; border-radius: var(--radius); border: 1px solid; }
  .gate.pass .verdict { color: var(--el-color-success); border-color: var(--el-color-success); background: var(--el-color-success-light-9); }
  .gate.block .verdict { color: var(--el-color-danger); border-color: var(--el-color-danger); background: var(--el-color-danger-light-9); }
  .gate.undecided .verdict { color: var(--el-color-warning); border-color: var(--el-color-warning); background: var(--el-color-warning-light-9); }
  .gate .why { font-size: 13px; color: var(--el-text-color-primary); }
  .gate .num { font-family: var(--mono); font-size: 21px; color: var(--el-text-color-primary); margin-left: auto; }
  .gate .num small { font-size: 13px; color: var(--el-text-color-secondary); }
  .gate-ci { padding: 0 18px 15px; font-size: 12px; color: var(--el-text-color-secondary); line-height: 1.7; }
  .gate-ci code { font-family: var(--mono); background: var(--el-fill-color-light); padding: 1px 5px; border-radius: 4px; word-break: break-all; }

  #viewOnboard { padding: 14px; display: grid; gap: 14px; }
  .steps { display: flex; flex-wrap: wrap; gap: 8px 4px; padding: 16px 18px 4px; }
  .steps .step { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--el-text-color-secondary); }
  .steps .step::after { content: ''; width: 26px; height: 1px; background: var(--el-border-color); margin: 0 8px; }
  .steps .step:last-child::after { display: none; }
  .steps .num { width: 20px; height: 20px; flex: none; border-radius: 50%; border: 1px solid var(--el-border-color);
                display: flex; align-items: center; justify-content: center; font-size: 12px; font-family: var(--mono); }
  /* 四步里只有最后一步是平台能自己判定的，前三步在被测方那边做完平台无从得知，
     所以不做「已完成」态 —— 打勾会变成一句没有依据的断言 */
  .steps .step.live { color: var(--el-color-primary); }
  .steps .step.live .num { border-color: var(--el-color-primary); color: var(--el-color-primary); }

  .lang-tabs { display: flex; gap: 4px; padding: 10px 18px 0; flex-wrap: wrap; }
  .lang-tabs button { height: 28px; padding: 0 13px; font-size: 13px; border: 1px solid var(--el-border-color-lighter);
                      background: var(--el-bg-color); border-radius: var(--radius); }
  .lang-tabs button.on { border-color: var(--el-color-primary); color: var(--el-color-primary); background: var(--el-color-primary-light-9); }

  .ob { padding: 14px 18px 18px; font-size: 13px; line-height: 1.75; color: var(--el-text-color-regular); }
  .ob h3 { font-size: 13px; margin: 18px 0 6px; color: var(--el-text-color-primary); font-weight: 600; }
  .ob h3:first-child { margin-top: 0; }
  .ob ul { margin: 4px 0; padding-left: 20px; }
  .ob code { font-family: var(--mono); background: var(--el-fill-color-light); padding: 1px 5px; border-radius: 4px; }
  .snip-wrap { position: relative; }
  .snip-wrap .copy { position: absolute; top: 14px; right: 10px; height: 24px; padding: 0 9px; font-size: 12px;
                     background: var(--el-bg-color); border: 1px solid var(--el-border-color-lighter); border-radius: var(--radius); }
  .snippet { margin: 8px 0 0; padding: 12px 14px; background: var(--el-fill-color-light);
             border: 1px solid var(--el-border-color-lighter); border-radius: var(--radius);
             font-family: var(--mono); font-size: 12px; line-height: 1.85; white-space: pre; overflow-x: auto;
             color: var(--el-text-color-primary); }
  .snippet .cm { color: var(--el-text-color-secondary); }
  .snippet .val { color: var(--el-color-primary); }
  .note { margin: 0 0 12px; padding: 10px 14px; border-radius: var(--radius); font-size: 13px; line-height: 1.75; }
  .note.info { background: var(--el-color-primary-light-9); color: var(--el-text-color-regular); }
  .note.risk { background: var(--el-color-warning-light-9); color: var(--el-text-color-regular); }
  .note b { color: var(--el-text-color-primary); }

  /* 表格比容器宽时必须自己横向滚动：.card 是 overflow:hidden，
     不给滚动容器的话右边几列会被直接裁掉 —— 既看不见，也没法滚过去看 */
  .tbl-wrap { overflow-x: auto; }
  table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.tbl th { text-align: left; font-size: 12px; font-weight: 600; color: var(--el-text-color-secondary); padding: 9px 14px; border-bottom: 1px solid var(--el-border-color-lighter); }
  table.tbl td { padding: 9px 14px; border-bottom: 1px solid var(--el-border-color-lighter); }
  table.tbl tr:last-child td { border-bottom: none; }
  table.tbl td.mono { font-family: var(--mono); font-size: 12px; }

  .tag { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 12px; border: 1px solid; }
  .tag.ok { color: var(--el-color-success); border-color: var(--el-color-success); background: var(--el-color-success-light-9); }
  .tag.err { color: var(--el-color-danger); border-color: var(--el-color-danger); background: var(--el-color-danger-light-9); }
  .tag.warn { color: var(--el-color-warning); border-color: var(--el-color-warning); background: var(--el-color-warning-light-9); }

  /* 条形图看差距更快，但数字仍要在 —— 只给条形图就没法核对 */
  .bar-track { height: 6px; min-width: 84px; flex: 1; border-radius: 3px; background: var(--el-fill-color-light); overflow: hidden; }
  .bar-fill { height: 100%; }
  .bar-fill.s { background: var(--el-color-success); }
  .bar-fill.w { background: var(--el-color-warning); }
  .bar-fill.d { background: var(--el-color-danger); }
  .rank-name { cursor: pointer; color: var(--el-color-primary); }
  .rank-name:hover { text-decoration: underline; }

  /* 纵轴钉死 0–100%：按数据范围自动缩放会把 0.2% 的抖动画成断崖 */
  .trend { padding: 14px; }
  .trend svg { display: block; width: 100%; height: 120px; }
  .trend .grid { stroke: var(--el-border-color-lighter); stroke-width: 1; vector-effect: non-scaling-stroke; }
  .trend .area { fill: var(--el-color-primary-light-9); }
  .trend .line { fill: none; stroke: var(--el-color-primary); stroke-width: 2; vector-effect: non-scaling-stroke; }
  .trend .dot { fill: var(--el-color-primary); }
  .trend-ax { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 11px; color: var(--el-text-color-secondary); margin-top: 6px; }
</style>
</head>
<body>
<header>
  <h1>代码实时染色平台</h1>
  <span id="probe" class="pill err"><i></i>探针未连接</span>
  <span id="overall" style="font-family:var(--mono);color:var(--el-text-color-primary)">—</span>
  <div class="spacer"></div>
  <div class="seg">
    <button data-mode="full" class="on">全量</button>
    <button data-mode="incremental">增量</button>
  </div>
  <input id="baseline" value="HEAD~1" title="增量基线 ref（分支名、tag 或 commit）" style="display:none" />
  <button id="btnCollect">立即采集</button>
  <button id="btnReset" class="primary">清零计数器</button>
</header>

<div class="bar">
  <label for="scenarioView">数据源</label>
  <select id="scenarioView"><option value="">实时（累计覆盖）</option></select>
  <span class="spacer"></span>
  <span id="recording" class="rec" style="display:none"><i></i>场景进行中</span>
  <input id="scenarioId" placeholder="场景 ID" title="给这一轮测试起个名字，例如 支付成功回归" />
  <button id="btnScenario">开始场景</button>
</div>

<div class="tabs">
  <button data-view="color" class="on">代码染色</button>
  <button data-view="dash">总览看板</button>
  <button data-view="onboard">服务接入</button>
</div>

<div id="banner"></div>

<main id="viewColor">
  <div class="card">
    <div class="card-head"><h2>源文件</h2><span class="sub" id="fileCount">0</span></div>
    <div id="files"><div class="empty">等待采集…</div></div>
  </div>

  <div class="card">
    <div class="card-head">
      <h2 id="curPath">未选择文件</h2>
      <span class="sub" id="curRatio"></span>
    </div>
    <div class="legend">
      <span><i style="background:var(--el-color-success)"></i>已覆盖</span>
      <span><i style="background:var(--el-color-warning)"></i>部分分支</span>
      <span><i style="background:var(--el-color-danger)"></i>未覆盖</span>
      <span><i style="background:var(--el-border-color)"></i>非可执行行</span>
      <span style="margin-left:auto">JaCoCo 探针为布尔型，只记录是否执行，不记录执行次数</span>
    </div>
    <div class="src" id="src"><div class="empty">在左侧选择一个文件</div></div>
  </div>
</main>

<section id="viewDash" style="display:none">
  <div class="stats" id="dashStats"></div>

  <div class="card">
    <div class="card-head">
      <h2>覆盖率门禁</h2>
      <span class="sub" id="gateMeta"></span>
    </div>
    <div id="gateBox"><div class="empty">等待判定…</div></div>
  </div>

  <div class="card">
    <div class="card-head">
      <h2>覆盖率变化</h2>
      <div class="seg">
        <button data-trend="session" class="on">本次会话</button>
        <button data-trend="build">跨构建</button>
      </div>
      <span class="sub" id="trendMeta"></span>
    </div>
    <div id="trendBox"><div class="empty">采样中…</div></div>
  </div>

  <div class="card">
    <div class="card-head">
      <h2>被测实例</h2>
      <button id="btnPerInst" title="对每个实例各跑一次归一化，开销与实例数成正比，所以不随轮询自动做">加载各实例覆盖</button>
      <span class="sub" id="dashCollected"></span>
    </div>
    <div id="instBox"><div class="empty">等待采集…</div></div>
  </div>

  <div class="card">
    <div class="card-head">
      <h2>覆盖率排行</h2>
      <div class="seg" style="margin-left:auto">
        <button data-rank="ratio" class="on">覆盖率最低</button>
        <button data-rank="missed">未覆盖行最多</button>
      </div>
    </div>
    <div id="rankBox"><div class="empty">等待采集…</div></div>
  </div>
</section>

<section id="viewOnboard" style="display:none">
  <div class="card">
    <div class="card-head">
      <h2>接入向导</h2>
      <span class="sub">源码零改动，只调启动参数或构建参数</span>
    </div>
    <div class="steps">
      <div class="step"><span class="num">1</span>选择语言</div>
      <div class="step"><span class="num">2</span>改启动 / 构建参数</div>
      <div class="step"><span class="num">3</span>重启被测服务</div>
      <div class="step live"><span class="num">4</span>回这一页看探针连上没有</div>
    </div>
    <div class="lang-tabs" id="langTabs">
      <button data-lang="java" class="on">Java</button>
      <button data-lang="go">Go</button>
      <button data-lang="cpp">C++</button>
      <button data-lang="rust">Rust</button>
    </div>
    <div class="ob" id="obPane"></div>
  </div>

  <div class="card">
    <div class="card-head">
      <h2>接入自检</h2>
      <span class="sub" id="obCheckMeta"></span>
    </div>
    <div id="obCheckBox"><div class="empty">等待采集…</div></div>
  </div>
</section>

<script>
  let current = null;
  let prevStatus = {};
  let mode = 'full';
  let view = 'color';
  // 换排序不必重新采集，所以留住上一份文件列表
  let rankBy = 'ratio';
  let lastFiles = [];
  // 会话内的覆盖率采样。这不是跨构建的历史 —— 平台目前零持久化，刷新页面即从头开始。
  // 界面上必须写明这一点，否则会被当成「这个项目的覆盖率长期趋势」
  let trend = [];
  let trendKey = '';
  // 各实例分别的覆盖。按需拉取，且是拉取那一刻的定格值 ——
  // 聚合仍在每 3 秒往前走，所以必须标出取数时间，否则两组数字并排会读成同一时刻的
  let perInst = null;
  let perInstAt = '';
  // 跨构建趋势来自历史表（每个构建一条峰值），与会话内采样是两码事，
  // 因此各画各的，不混在一条线里
  let trendScope = 'session';
  let buildTrend = [];
  let buildTrendErr = null;
  // 看哪一份数据：空串是实时累计覆盖，否则是某个已归档场景的独占覆盖
  let viewScenario = '';

  const cls = r => r >= 70 ? 's' : r >= 45 ? 'w' : 'd';

  // PARTIAL 也是有数据的：少了某台实例的那部分，但其余仍是真的，
  // 因此照常显示覆盖率，只是状态与全连上区分开。
  // 顶栏与看板必须共用这一个判断 —— 一处显示「—」另一处却给个数字，
  // 用户会以为那个数字是可信的
  const hasData = d => d.probeStatus === 'CONNECTED' || d.probeStatus === 'PARTIAL'
    || d.probeStatus === 'ARCHIVED';

  function params() {
    const p = mode === 'incremental'
      ? 'mode=incremental&baseline=' + encodeURIComponent(document.getElementById('baseline').value.trim())
      : 'mode=full';
    return viewScenario ? p + '&scenarioId=' + encodeURIComponent(viewScenario) : p;
  }

  // 服务端算不出可信结果时返回 4xx。此时必须清空视图：
  // 留着上一次的染色结果，用户会以为那就是本次的答案
  function unavailable(msg) {
    document.getElementById('banner').innerHTML = '<div class="err">当前视图不可用：' + esc(msg) + '</div>';
    document.getElementById('overall').textContent = '—';
    document.getElementById('fileCount').textContent = '0 个';
    document.getElementById('files').innerHTML = '<div class="empty">—</div>';
    document.getElementById('src').innerHTML = '<div class="empty">—</div>';
    // 看板同样要清空：一屏可信的数字比染色更容易被当成结论，留着上一次的更危险
    lastFiles = [];
    document.getElementById('dashStats').innerHTML = '';
    document.getElementById('dashCollected').textContent = '';
    document.getElementById('instBox').innerHTML = '<div class="empty">—</div>';
    document.getElementById('rankBox').innerHTML = '<div class="empty">—</div>';
    // 曲线也要作废：算不出结果时留着上一段走势，会被读成「刚刚还在涨」
    trend = [];
    document.getElementById('trendMeta').textContent = '';
    document.getElementById('trendBox').innerHTML = '<div class="empty">—</div>';
    // 门禁结论比其它数字更像「结论」，留着上一次的会被直接拿去决定合不合并
    document.getElementById('gateMeta').textContent = '';
    document.getElementById('gateBox').innerHTML = '<div class="empty">—</div>';
    // 接入自检表故意不清：触发本函数的典型原因就是增量返回 409（某台实例脏了、
    // 或实例间版本不一致），而这张表正是唯一能点名「是哪一台」的地方。
    // 探针连没连上与增量算不算得出来是两件事，清掉等于把诊断信息一起收走
  }

  async function loadSummary() {
    const r = await fetch('/api/coverage/summary?' + params());
    const d = await r.json();
    if (!r.ok) {
      unavailable(d.error);
      return null;
    }
    render(d);
    return d;
  }

  async function refresh() {
    const d = await loadSummary();
    if (d && current) await openFile(current);
    return d;
  }

  // 门禁与 summary 分开取：summary 拿不到判定所需的阈值与「判不了」的原因，
  // 而门禁的 409 不该把整个视图清空 —— 判不了门禁，染色仍然是好的。
  // 代价是两次请求可能落在不同轮采集上，卡片的比例会比同屏的数字差一轮，
  // 下一次推送即自愈；换口径时的乱序则必须挡掉，见 gateSeq
  let gateSeq = 0;
  async function loadGate() {
    const seq = ++gateSeq;
    const meta = document.getElementById('gateMeta');
    const box = document.getElementById('gateBox');
    if (viewScenario) {
      // 场景快照是过去某一轮的独占覆盖，不是当前构建的整体情况；
      // 拿它判门禁，得出的结论与「这次能不能合并」无关
      meta.textContent = '';
      box.innerHTML = '<div class="empty">场景快照不参与门禁判定</div>';
      return;
    }
    const q = params();
    let r, d;
    try {
      r = await fetch('/api/coverage/gate?' + q);
      d = await r.json();
    } catch (e) {
      d = { error: String(e) };
    }
    // 换口径时前一次请求可能后到，用它的结论覆盖新口径的，卡片会停在错的答案上
    if (seq !== gateSeq) return;
    if (!r || !r.ok) {
      // 409 是「判不了」，与「不通过」分开显示：前者要找人看平台，后者要补测试
      meta.textContent = '';
      box.innerHTML = '<div class="gate undecided"><span class="verdict">无法判定</span>' +
        '<span class="why">' + esc(d.error || ('HTTP ' + r.status)) + '</span></div>';
      return;
    }
    meta.textContent = d.metric + ' · 阈值 ' + d.threshold + '%';
    box.innerHTML = '<div class="gate ' + (d.passed ? 'pass' : 'block') + '">' +
      '<span class="verdict">' + (d.passed ? '通过' : '不通过') + '</span>' +
      '<span class="why">' + esc(d.reason) + '</span>' +
      '<span class="num">' + (d.actual === null ? '—' : d.actual + '<small>%</small>') + '</span>' +
      '</div>' +
      '<div class="gate-ci">CI 合并前调 <code>GET /api/coverage/gate?' + esc(q) + '</code>，' +
      '按 <code>passed</code> 放行或阻断；判不了时返回 409，别把它当成不通过。</div>';
  }

  function render(d) {
    const probe = document.getElementById('probe');
    const live = (d.instances || []).filter(i => i.status === 'CONNECTED').length;
    const total = (d.instances || []).length;
    // PARTIAL 也是有数据的：少了某台实例的那部分，但其余仍是真的，
    // 因此照常显示覆盖率，只是状态与全连上区分开
    // 探针不可达与平台配置错误是两回事，排查方向完全不同，界面上必须分开说
    const label = {
      CONNECTED: '探针已连接 · ' + live + '/' + total + ' 实例 · 3s 轮询',
      PARTIAL: '仅 ' + live + '/' + total + ' 个实例在线 · 覆盖数据不完整',
      ARCHIVED: '场景快照 · 数据已定格',
      DISCONNECTED: '探针未连接',
      ANALYZE_ERROR: '探针正常，分析失败',
      CONFIG_ERROR: '平台配置有误'
    }[d.probeStatus] || '状态未知';
    probe.className = 'pill ' + (d.probeStatus === 'CONNECTED' || d.probeStatus === 'ARCHIVED' ? 'ok'
      : d.probeStatus === 'PARTIAL' ? 'warn' : 'err');
    probe.innerHTML = '<i></i>' + label;

    // 场景视图看的是已定格的归档数据，必须标出来，否则会被当成实时累计覆盖
    const scope = d.scenarioId ? '场景 ' + d.scenarioId + ' · ' : '';
    document.getElementById('overall').textContent = !hasData(d) ? '—'
      : d.mode === 'incremental'
        ? scope + '增量行覆盖率 ' + d.overallRatio + '% · 基线 ' + d.baselineCommit.substring(0, 8)
          + ' → 产物 ' + d.buildCommit.substring(0, 8)
        : scope + '整体行覆盖率 ' + d.overallRatio + '%';

    let banner = '';
    if (d.versionError) {
      // 版本不一致时聚合结果会静默少算，比缺一台实例更危险，所以排在最前面说
      banner = '<div class="err">' + esc(d.versionError) + '</div>';
    } else if (d.probeStatus === 'PARTIAL' && d.lastError) {
      banner = '<div class="warn">' + esc(d.lastError) +
        '<br>这些实例跑过的代码在下面会显示成未覆盖，别据此判断「没测到」。</div>';
    } else if (d.probeStatus === 'CONFIG_ERROR' && d.lastError) {
      banner = '<div class="err">被测实例地址配置有误：' + esc(d.lastError) +
        '<br>问题在平台侧的 coverage.instances 配置，不在被测服务。</div>';
    } else if (d.probeStatus === 'DISCONNECTED' && d.lastError) {
      banner = '<div class="err">探针不可达：' + esc(d.lastError) + '<br>请确认被测服务已带 -javaagent 参数启动，且 tcpserver 端口可达。</div>';
    } else if (d.probeStatus === 'ANALYZE_ERROR' && d.lastError) {
      banner = '<div class="err">覆盖数据分析失败：' + esc(d.lastError) + '<br>探针连接正常，问题在平台侧 —— 请检查 coverage.classes-dir 配置是否指向被测服务的编译产物。</div>';
    }
    document.getElementById('banner').innerHTML = banner;

    // 看板与染色共用这一份 summary，不另发请求：多取一次不只是浪费，
    // 两份数据还可能来自不同轮采集，两个视图的数字就会对不上
    renderDash(d);
    renderOnboard(d);
    // 不 await：门禁要跑一次 git diff，让它挡在染色前面会拖慢整屏刷新
    loadGate();

    document.getElementById('fileCount').textContent = d.files.length + ' 个';
    const box = document.getElementById('files');
    if (!d.files.length) {
      // 文件列表来自字节码分析，跑没跑过都在里面，所以空列表只可能是增量口径把范围筛空了，
      // 与看的是实时还是某个场景无关
      box.innerHTML = '<div class="empty">' +
        (d.mode === 'incremental' ? '基线之后没有变更的可执行代码' : '尚无数据') + '</div>';
      return;
    }
    box.innerHTML = d.files.map(f =>
      '<button class="file' + (f.path === current ? ' on' : '') + '" data-path="' + f.path + '">' +
        '<span class="nm">' + f.sourceFileName + '</span>' +
        '<span class="pc ' + cls(f.ratio) + '">' + f.ratio + '%</span>' +
      '</button>').join('');
    box.querySelectorAll('.file').forEach(b =>
      b.addEventListener('click', () => openFile(b.dataset.path)));
  }

  const LANG = { java: 'Java', go: 'Go', cpp: 'C++', rust: 'Rust' };

  function renderDash(d) {
    const files = d.files || [];
    lastFiles = files;
    const covered = files.reduce((a, f) => a + f.coveredLines, 0);
    const missed = files.reduce((a, f) => a + f.missedLines, 0);
    const inst = d.instances || [];
    const live = inst.filter(i => i.status === 'CONNECTED').length;
    // 看板的数字随口径变，不标出来会被当成全量：增量下的「未覆盖 12 行」
    // 和全量下的「未覆盖 12 行」是完全不同的两件事
    const scope = d.scenarioId ? '场景 ' + d.scenarioId
      : d.mode === 'incremental' ? '增量口径' : '全量口径';

    // 探针够不到时顶栏显示「—」，看板这几个数字也必须一起变成「—」
    const ok = hasData(d);
    document.getElementById('dashStats').innerHTML = [
      ['统计口径', esc(scope)],
      ['行覆盖率', ok ? d.overallRatio + '<small>%</small>' : '—'],
      ['已覆盖行', ok ? covered : '—'],
      ['未覆盖行', ok ? missed : '—'],
      ['源文件', files.length + '<small> 个</small>'],
      ['在线实例', inst.length ? live + '<small>/' + inst.length + '</small>' : '—']
    ].map(([k, v]) => '<div class="stat"><div class="k">' + k + '</div><div class="v">' + v + '</div></div>').join('');

    document.getElementById('dashCollected').textContent =
      d.lastCollectedAt ? '最后采集 ' + new Date(d.lastCollectedAt).toLocaleTimeString() : '';

    // 口径一换，纵轴的含义就变了：把增量的 12% 和全量的 30% 画进同一条线是骗人的，
    // 所以换口径 / 换场景就把采样清掉重开
    const key = d.mode + '|' + (d.scenarioId || '');
    if (key !== trendKey) { trendKey = key; trend = []; }
    if (ok) {
      trend.push({ t: Date.now(), r: d.overallRatio });
      if (trend.length > 240) trend.shift();
    }
    renderTrend(scope);

    const instBox = document.getElementById('instBox');
    if (!inst.length) {
      // 场景快照是定格数据，服务端不返回实例列表。写成「无实例」会被读成全部掉线
      instBox.innerHTML = '<div class="empty">' +
        (d.probeStatus === 'ARCHIVED' ? '场景快照不含实例信息（数据已定格）' : '尚无实例') + '</div>';
    } else {
      const pi = perInst ? new Map(perInst.map(r => [r.endpoint, r])) : null;
      instBox.innerHTML = '<div class="tbl-wrap"><table class="tbl"><thead><tr>' +
        '<th>探针地址</th><th>语言</th><th>状态</th><th>构建版本</th>' +
        (pi ? '<th>该实例行覆盖率</th><th>已覆盖</th><th>未覆盖</th>' : '') +
        '<th>说明</th>' +
        '</tr></thead><tbody>' + inst.map(i => {
          const lang = String(i.endpoint).split('://')[0];
          const ok = i.status === 'CONNECTED';
          return '<tr>' +
            '<td class="mono">' + esc(i.endpoint) + '</td>' +
            '<td>' + esc(LANG[lang] || lang) + '</td>' +
            '<td><span class="tag ' + (ok ? 'ok' : 'err') + '">' + esc(i.status) + '</span></td>' +
            // dirty 单独标出来：版本不一致的横幅只说「有实例对不上」，
            // 不点名的话得去翻各实例的启动参数才知道是哪一台脏了
            '<td class="mono">' + (i.buildCommit ? esc(i.buildCommit.substring(0, 8)) : '—') +
              (i.dirty ? ' <span class="tag warn" title="该实例构建时被测源码有未提交改动，增量口径不可用">dirty</span>' : '') +
            '</td>' +
            (pi ? (() => {
              const r = pi.get(i.endpoint);
              if (!r || r.overallRatio === null || r.overallRatio === undefined) {
                return '<td class="mono">—</td><td class="mono">—</td><td class="mono">—</td>';
              }
              return '<td><span class="pc ' + cls(r.overallRatio) + '" style="font-family:var(--mono);font-size:12px">'
                   + r.overallRatio + '%</span></td>'
                   + '<td class="mono">' + r.coveredLines + '</td>'
                   + '<td class="mono">' + r.missedLines + '</td>';
            })() : '') +
            '<td>' + (i.error ? '<span style="color:var(--el-color-danger)">' + esc(i.error) + '</span>' : '') + '</td>' +
          '</tr>';
        }).join('') + '</tbody></table></div>' +
        (perInst ? '<div class="legend" style="border-bottom:none;border-top:1px solid var(--el-border-color-lighter)">'
          + '各实例覆盖取自 ' + esc(perInstAt) + ' 的定格值，不随轮询刷新；'
          + '这几列<strong>不能相加当聚合用</strong> —— 两台各覆盖同一行的不同分支时，'
          + '按实例算是 PARTIAL、合并算才是 COVERED。聚合值以顶栏为准。</div>' : '');
    }

    renderRank();
  }

  // 把一串 0-100 的数值画成折线。纵轴钉死 0–100%，不按数据范围缩放 ——
  // 自动缩放会把 0.2% 的抖动画成断崖
  function trendSvg(values) {
    const W = 600, H = 100;
    const n = values.length;
    const pts = values.map((r, i) => [(n === 1 ? 0 : i / (n - 1)) * W, H - r / 100 * H]);
    const line = pts.map(([x, y]) => x.toFixed(1) + ',' + y.toFixed(1)).join(' ');
    const area = pts[0][0].toFixed(1) + ',' + H + ' ' + line + ' ' + pts[n - 1][0].toFixed(1) + ',' + H;
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" aria-label="覆盖率变化曲线">' +
        '<line class="grid" x1="0" y1="0" x2="' + W + '" y2="0"></line>' +
        '<line class="grid" x1="0" y1="' + (H / 2) + '" x2="' + W + '" y2="' + (H / 2) + '"></line>' +
        '<line class="grid" x1="0" y1="' + H + '" x2="' + W + '" y2="' + H + '"></line>' +
        '<polygon class="area" points="' + area + '"></polygon>' +
        '<polyline class="line" points="' + line + '"></polyline>' +
        '<circle class="dot" cx="' + pts[n - 1][0].toFixed(1) + '" cy="' +
          pts[n - 1][1].toFixed(1) + '" r="3"></circle>' +
      '</svg>';
  }

  function renderTrend(scope) {
    const box = document.getElementById('trendBox');
    const meta = document.getElementById('trendMeta');

    if (trendScope === 'build') {
      // 历史取不到时必须说明原因：回一张空图会被读成「这个项目一直没有覆盖」，
      // 而真实原因可能只是数据库没起
      if (buildTrendErr) {
        box.innerHTML = '<div class="err">覆盖率历史不可用：' + esc(buildTrendErr) + '</div>';
        meta.textContent = '';
        return;
      }
      const note = '每个构建一个点，取该构建观测到的峰值';
      if (buildTrend.length < 2) {
        box.innerHTML = '<div class="empty">'
          + (buildTrend.length ? '只有 1 个构建的记录，还连不成趋势' : '尚无构建记录')
          + '（' + note + '）</div>';
        meta.textContent = '';
        return;
      }
      const first = buildTrend[0], last = buildTrend[buildTrend.length - 1];
      const delta = Math.round((last.overallRatio - first.overallRatio) * 10) / 10;
      box.innerHTML = '<div class="trend">' + trendSvg(buildTrend.map(b => b.overallRatio)) +
        '<div class="trend-ax"><span>0%</span><span>纵轴固定 0–100% · ' + note + '</span>'
        + '<span>100%</span></div></div>';
      meta.textContent = buildTrend.length + ' 个构建 · ' + first.buildCommit.substring(0, 8)
        + ' → ' + last.buildCommit.substring(0, 8) + '（'
        + (delta >= 0 ? '+' : '') + delta + '）';
      return;
    }

    const note = '本次会话内的变化，非跨构建历史';
    if (trend.length < 2) {
      box.innerHTML = '<div class="empty">采样中…（' + note + '）</div>';
      meta.textContent = trend.length ? '已采 1 点' : '';
      return;
    }
    const last = trend[trend.length - 1], first = trend[0];
    const delta = Math.round((last.r - first.r) * 10) / 10;
    const secs = Math.round((last.t - first.t) / 1000);
    box.innerHTML = '<div class="trend">' + trendSvg(trend.map(p => p.r)) +
      '<div class="trend-ax"><span>0%</span><span>纵轴固定 0–100% · ' + note + '</span>'
      + '<span>100%</span></div></div>';
    meta.textContent = esc(scope) + ' · ' + trend.length + ' 点 / ' + secs + 's · '
      + first.r + '% → ' + last.r + '%（' + (delta >= 0 ? '+' : '') + delta + '）';
  }

  // 「覆盖率最低」与「未覆盖行最多」不是一回事：一个 0% 的小文件和一个 60% 却缺 500 行的
  // 大文件，该先补哪个取决于问的是哪个问题。所以两种排序都留着，而不是替用户选一个
  function renderRank() {
    const box = document.getElementById('rankBox');
    if (!lastFiles.length) { box.innerHTML = '<div class="empty">尚无数据</div>'; return; }
    const rows = lastFiles.slice().sort(rankBy === 'missed'
      ? (a, b) => b.missedLines - a.missedLines || a.ratio - b.ratio
      : (a, b) => a.ratio - b.ratio || b.missedLines - a.missedLines);
    box.innerHTML = '<div class="tbl-wrap"><table class="tbl"><thead><tr>' +
      '<th style="width:34px">#</th><th>文件</th><th style="width:170px">行覆盖率</th>' +
      '<th style="width:84px">已覆盖</th><th style="width:84px">未覆盖</th>' +
      '</tr></thead><tbody>' + rows.map((f, n) =>
        '<tr>' +
          '<td class="mono">' + (n + 1) + '</td>' +
          '<td><span class="rank-name" data-path="' + esc(f.path) + '" title="' + esc(f.path) + '">' +
            esc(f.sourceFileName) + '</span>' +
            '<div style="font-size:12px;color:var(--el-text-color-secondary)">' + esc(f.packageName) + '</div></td>' +
          '<td><div style="display:flex;align-items:center;gap:8px">' +
            '<div class="bar-track"><div class="bar-fill ' + cls(f.ratio) + '" style="width:' + f.ratio + '%"></div></div>' +
            '<span class="pc ' + cls(f.ratio) + '" style="font-family:var(--mono);font-size:12px">' + f.ratio + '%</span>' +
          '</div></td>' +
          '<td class="mono">' + f.coveredLines + '</td>' +
          '<td class="mono">' + f.missedLines + '</td>' +
        '</tr>').join('') + '</tbody></table></div>';
    // 排行的用处是「找到该补的文件、然后去看它」，所以点文件名直接跳进染色视图
    box.querySelectorAll('.rank-name').forEach(el =>
      el.addEventListener('click', () => { switchView('color'); openFile(el.dataset.path); }));
  }

  function switchView(next) {
    view = next;
    document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.view === view));
    document.getElementById('viewColor').style.display = view === 'color' ? '' : 'none';
    document.getElementById('viewDash').style.display = view === 'dash' ? '' : 'none';
    document.getElementById('viewOnboard').style.display = view === 'onboard' ? '' : 'none';
  }

  async function openFile(path) {
    // 换文件就丢弃上一份行状态，否则会拿 A 文件第 N 行的状态去比 B 文件第 N 行，
    // 把一条从未变化的行误报成「刚刚被覆盖」
    if (path !== current) prevStatus = {};
    current = path;
    document.querySelectorAll('.file').forEach(b =>
      b.classList.toggle('on', b.dataset.path === path));

    const r = await fetch('/api/coverage/file?path=' + encodeURIComponent(path) + '&' + params());
    const d = await r.json();
    if (!r.ok) {
      unavailable(d.error);
      return;
    }
    document.getElementById('curPath').textContent = path;

    if (!d.found) {
      document.getElementById('src').innerHTML = '<div class="err">' + esc(d.error || '未找到该文件') + '</div>';
      return;
    }
    document.getElementById('curRatio').textContent =
      d.ratio + '% · 已覆盖 ' + d.coveredLines + ' 行 / 未覆盖 ' + d.missedLines + ' 行';

    const next = {};
    document.getElementById('src').innerHTML = d.rows.map(r => {
      next[r.line] = r.status;
      // 上一次是未覆盖、这次变成已覆盖 → 高亮闪一下，让「变绿」这件事可见
      const justCovered = prevStatus[r.line] === 'MISSED' && r.status === 'COVERED';
      // 增量视图下基线之后没动过的行只作上下文，不染色
      if (r.inDiff === false) {
        return '<div class="ln out"><span class="no">' + r.line + '</span>' +
               '<span class="tx">' + esc(r.text) + '</span></div>';
      }
      return '<div class="ln ' + r.status + (justCovered ? ' flash' : '') + '">' +
             '<span class="no">' + r.line + '</span>' +
             '<span class="tx">' + esc(r.text) + '</span></div>';
    }).join('');
    prevStatus = next;
  }

  // 引号也必须转义：场景 ID 由用户自取，会被拼进 value="..." 属性，
  // 少转一个引号就能从属性里逃出来挂上事件处理器
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  // 换口径或换数据源后文件范围会变，原先选中的文件可能已不在范围内
  async function reload() {
    prevStatus = {};
    const d = await loadSummary();
    // 视图不可用时保留 current，恢复后仍回到用户原先看的那个文件
    if (!d) return;
    const keep = d.files.some(f => f.path === current);
    const path = keep ? current : (d.files.length ? d.files[0].path : null);
    current = null;
    if (path) {
      await openFile(path);
    } else {
      document.getElementById('curPath').textContent = '未选择文件';
      document.getElementById('curRatio').textContent = '';
      document.getElementById('src').innerHTML = '<div class="empty">在左侧选择一个文件</div>';
    }
  }

  async function switchTo(next) {
    mode = next;
    // 限定 [data-mode]：排行的排序切换也是一组 .seg，不限定会把它的选中态一并抹掉
    document.querySelectorAll('.seg button[data-mode]').forEach(b => b.classList.toggle('on', b.dataset.mode === mode));
    document.getElementById('baseline').style.display = mode === 'incremental' ? '' : 'none';
    await reload();
  }

  document.querySelectorAll('.seg button[data-mode]').forEach(b =>
    b.addEventListener('click', () => switchTo(b.dataset.mode)));
  document.getElementById('baseline').addEventListener('change', () => switchTo('incremental'));

  async function loadBuildTrend() {
    try {
      const r = await fetch('/api/coverage/trend');
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
      buildTrend = d.available ? d.builds : [];
      buildTrendErr = d.available ? null : (d.error || '历史不可用');
    } catch (e) {
      buildTrend = [];
      buildTrendErr = e.message;
    }
    renderTrend('');
  }

    b.addEventListener('click', async () => {
      trendScope = b.dataset.trend;
      document.querySelectorAll('button[data-trend]').forEach(x =>
        x.classList.toggle('on', x.dataset.trend === trendScope));
      // 跨构建数据来自历史表，不随 3 秒轮询变，切过去时取一次即可
      if (trendScope === 'build') { await loadBuildTrend(); } else { renderTrend(''); }
    }));

  // 同事多半是从 http://内网IP:18090 打开这个平台的，而非 localhost 的 http 源上
  // navigator.clipboard 压根不存在 —— 只用它的话，复制按钮对多数人是废的。
  // 所以退回 execCommand：它早已废弃，但不挑安全上下文，正是这里需要的
  async function copyText(text) {
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return true;
      }
    } catch (e) { /* 落到下面的兜底 */ }
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;left:-9999px;top:0';
    document.body.appendChild(ta);
    ta.select();
    let done = false;
    try { done = document.execCommand('copy'); } catch (e) { done = false; }
    document.body.removeChild(ta);
    return done;
  }

  // 那不代表「没配这门语言」—— 跟着清空的话，向导会把真实端口换成默认端口，
  // 照抄下去连不上，而页面上看不出任何异样
  let lastLiveInstances = [];
  // 命令块只跟语言和端点有关。每次 WS 推送都重建的话，
  // 用户正在选中的命令文本、横向滚动位置、以及「已复制」提示会被一起抹掉
  let obPaneKey = null;

  /** 从最近一份非空实例列表里挑出该语言实际配置的地址，没有就给个占位 */
  function obEndpoints(lang) {
    return lastLiveInstances
      .filter(i => String(i.endpoint).split('://')[0] === lang)
      .map(i => {
        const hp = String(i.endpoint).split('://')[1] || '';
        const at = hp.lastIndexOf(':');
        return { host: hp.substring(0, at), port: hp.substring(at + 1), status: i.status };
      });
  }

  function renderObPane() {
    const o = OB[obLang];
    const eps = obEndpoints(obLang);
    const key = obLang + '|' + eps.map(e => e.host + ':' + e.port).join(',');
    if (key === obPaneKey) return;
    obPaneKey = key;
    // 端口取本平台实际配置的那个。没配这门语言时用默认端口，并说明这是默认值，
    // 免得照抄之后发现平台根本没在听这个端口
    const hp = eps.length ? eps[0] : { host: '127.0.0.1', port: String(o.port) };

    let html = '<div class="note ' + o.note[0] + '">' + o.note[1] + '</div>';

    html += '<h3>1 · 改启动 / 构建参数</h3>';
    const raw = o.cmd(hp).map(([, t]) => t.replace(/@@/g, '')).join('\n');
    html += '<div class="snip-wrap"><button class="copy" data-copy="1">复制</button><pre class="snippet">' +
      o.cmd(hp).map(([cls, t]) => {
        const parts = esc(t).split('@@');
        // 奇数段是从平台配置里取出来的实际值，标出来让人知道哪里是真的、哪里是占位
        const body = parts.map((x, n) => n % 2 ? '<span class="val">' + x + '</span>' : x).join('');
        return cls ? '<span class="' + cls + '">' + body + '</span>' : body;
      }).join('\n') + '</pre></div>';
    html += '<div style="font-size:12px;color:var(--el-text-color-secondary);margin-top:6px">' +
      (eps.length
        ? '蓝色部分取自本平台的 <code>coverage.instances</code> 配置，是实际在监听的地址。' +
          (eps.length > 1 ? '本平台还配了 ' + esc(eps.slice(1).map(e => e.host + ':' + e.port).join('、')) +
            '，第二个实例把地址换成它。' : '')
        : '本平台目前没有配置 ' + o.name + ' 实例，上面用的是默认端口。' +
          '实际接入时端口由你定，填进平台配置即可。') + '</div>';

    html += '<h3>2 · 把地址填进平台配置</h3>';
    html += '<div class="note info">平台<b>没有注册中心</b>，实例不会自己上报 —— 地址写在平台的 ' +
      '<code>coverage.instances</code> 里，<b>改完要重启平台</b>。' +
      '不写语言前缀默认按 <code>java</code> 解析。</div>';
    html += '<div class="snip-wrap"><pre class="snippet">' +
      esc('coverage:\n  instances:\n    - "' + (obLang === 'java' ? '' : obLang + '://') +
        hp.host + ':' + hp.port + '"') + '</pre></div>';
    html += '<h3>3 · 平台侧还要配这几项</h3><ul>' +
      o.cfg.map(([k, v]) => '<li><code>' + k + '</code> —— ' + v + '</li>').join('') + '</ul>';

    html += '<h3>4 · 这门语言特有的坑</h3><ul>' +
      (o.tips.length ? o.tips.map(t => '<li>' + t + '</li>').join('')
        : '<li>没有额外的坑 —— Java 是四种语言里唯一产物也不用动的。</li>') +
      '<li><b>各实例的构建版本必须完全一致（含 <code>-dirty</code> 后缀）。</b>' +
      'commit 相同但一台脏一台净，加载的是两份不同的字节码，平台会判为版本冲突并拒绝出增量报告。' +
      '脏标记要按全部被测源码根一起判定，各语言各算各的会把人引去核对版本。</li>' +
      '<li><b>探针端口没有任何鉴权。</b>只绑内网地址，靠网络策略限制来源；本平台只面向测试环境。</li>' +
      '</ul>';

    const pane = document.getElementById('obPane');
    pane.innerHTML = html;
    const btn = pane.querySelector('.copy');
    if (btn) {
      btn.addEventListener('click', async () => {
        btn.textContent = await copyText(raw) ? '已复制' : '复制失败，请手动选中';
        setTimeout(() => { btn.textContent = '复制'; }, 1600);
      });
    }
  }

  const OB_HINT = {
    java: '确认启动参数带了 <code>-javaagent:...=output=tcpserver</code> 且端口一致，探针随 JVM 启动、不能事后挂载',
    go: '确认服务是用 <code>-cover -covermode=atomic -tags=goverage</code> 重新编译并重启过的',
    cpp: '确认服务是用 <code>--coverage</code> 重新编译、且链接了 coverage_agent 的那个产物',
    rust: '确认服务是用 <code>-C instrument-coverage</code> 重新编译、且注入了探针 .o 的那个产物'
  };

  function renderOnboard(d) {
    const inst = d.instances || [];
    if (inst.length) lastLiveInstances = inst;
    renderObPane();

    const box = document.getElementById('obCheckBox');
    document.getElementById('obCheckMeta').textContent =
      inst.length ? inst.filter(i => i.status === 'CONNECTED').length + '/' + inst.length + ' 已连上' : '';
    if (!inst.length) {
      box.innerHTML = d.probeStatus === 'CONFIG_ERROR'
        ? '<div class="warn" style="margin:14px">平台配置有误，实例一个都没解析出来：<br>' +
          '<span class="mono">' + esc(d.lastError || '（平台未给出原因）') + '</span></div>'
        : '<div class="empty">' +
          (d.probeStatus === 'ARCHIVED' ? '场景快照不含实例信息（数据已定格）'
            : '平台的 coverage.instances 里没有配置任何实例') + '</div>';
      return;
    }
    // 版本不一致要单独说：它不是「没连上」，恰恰是全连上了才会出现，
    // 而后果比掉一台更严重 —— 聚合会静默丢弃对不上的那部分
    const banner = d.versionError
      ? '<div class="warn" style="margin:14px 14px 0">' + esc(d.versionError) + '</div>' : '';
    box.innerHTML = banner + '<div class="tbl-wrap"><table class="tbl"><thead><tr>' +
      '<th>探针地址</th><th>语言</th><th>接上没有</th><th>自报构建版本</th><th>下一步</th>' +
      '</tr></thead><tbody>' + inst.map(i => {
        const lang = String(i.endpoint).split('://')[0];
        const on = i.status === 'CONNECTED';
        const sha = i.buildCommit ? i.buildCommit.substring(0, 8) : '—';
        let todo;
        if (!on) {
          todo = '没连上（' + esc(i.status) + '）。' + (OB_HINT[lang] || '') +
            (i.error ? '<br><span class="mono">' + esc(i.error) + '</span>' : '');
        } else if (!i.buildCommit) {
          todo = '已接入，但没上报构建版本 —— 补上 ' +
            (lang === 'java' ? '<code>sessionid</code>' : '<code>COVERAGE_BUILD_ID</code>') +
            '，否则增量口径不可用';
        } else if (i.dirty) {
          todo = '已接入，但被测源码有未提交的改动（<code>-dirty</code>）。' +
            '产物对不上任何一个提交，平台会拒绝出增量报告 —— 提交后重新构建并重启';
        } else {
          todo = '<span style="color:var(--el-color-success)">已接入，无需再做什么</span>';
        }
        return '<tr>' +
          '<td class="mono">' + esc(i.endpoint) + '</td>' +
          '<td>' + esc(LANG[lang] || lang) + '</td>' +
          '<td><span class="tag ' + (on ? 'ok' : 'err') + '">' + (on ? '已连上' : '未连上') + '</span></td>' +
          '<td class="mono">' + esc(sha) + (i.dirty ? ' <span class="tag err">dirty</span>' : '') + '</td>' +
          '<td>' + todo + '</td>' +
          '</tr>';
      }).join('') + '</tbody></table></div>';
  }

  document.querySelectorAll('#langTabs button').forEach(b =>
    b.addEventListener('click', () => {
      obLang = b.dataset.lang;
      document.querySelectorAll('#langTabs button').forEach(x => x.classList.toggle('on', x.dataset.lang === obLang));
      renderObPane();
    }));

  document.querySelectorAll('.tabs button').forEach(b =>
    b.addEventListener('click', () => switchView(b.dataset.view)));
  document.querySelectorAll('button[data-rank]').forEach(b =>
    b.addEventListener('click', () => {
      rankBy = b.dataset.rank;
      document.querySelectorAll('button[data-rank]').forEach(x => x.classList.toggle('on', x.dataset.rank === rankBy));
      renderRank();
    }));

  document.getElementById('scenarioView').addEventListener('change', async e => {
    viewScenario = e.target.value;
    await reload();
  });

  // 场景归因：start 清零 → 跑测试 → stop 定格。列表与按钮状态都以服务端为准
  async function loadScenarios() {
    const d = await (await fetch('/api/scenario')).json();
    const sel = document.getElementById('scenarioView');
    sel.innerHTML = '<option value="">实时（累计覆盖）</option>' +
      d.scenarios.map(s => '<option value="' + esc(s.scenarioId) + '">场景 ' + esc(s.scenarioId) +
        '（' + s.files + ' 文件 / ' + s.overallRatio + '%）</option>').join('');
    sel.value = viewScenario;
    // 服务端才知道场景有没有在跑；页面刷新后也要能正确恢复按钮状态
    const running = !!d.active;
    document.getElementById('recording').style.display = running ? '' : 'none';
    document.getElementById('recording').lastChild.textContent = '场景 ' + (d.active || '') + ' 进行中';
    document.getElementById('btnScenario').textContent = running ? '结束场景' : '开始场景';
    document.getElementById('scenarioId').value = running ? d.active : document.getElementById('scenarioId').value;
    document.getElementById('scenarioId').disabled = running;
    // 场景进行中清零会让归因数据只剩清零之后那一段，服务端会拒绝，这里先把入口关掉
    const reset = document.getElementById('btnReset');
    reset.disabled = running;
    reset.title = running ? '场景进行中不能清零，否则该场景的归因数据会被截断' : '';
    return d;
  }

  document.getElementById('btnScenario').addEventListener('click', async () => {
    const btn = document.getElementById('btnScenario');
    const idInput = document.getElementById('scenarioId');
    const starting = btn.textContent === '开始场景';
    const url = starting
      ? '/api/scenario/start?scenarioId=' + encodeURIComponent(idInput.value.trim())
      : '/api/scenario/stop';
    const r = await fetch(url, { method: 'POST' });
    const d = await r.json();
    if (!r.ok) {
      document.getElementById('banner').innerHTML = '<div class="err">' + esc(d.error) + '</div>';
      return;
    }
    document.getElementById('banner').innerHTML = '';
    // 场景一结束就切过去看它覆盖了什么 —— 这正是录制这一轮的目的
    if (!starting) {
      viewScenario = d.scenarioId;
      idInput.value = '';
    } else {
      viewScenario = '';
    }
    await loadScenarios();
    await reload();
  });

  document.getElementById('btnCollect').addEventListener('click', async () => {
    const d = await (await fetch('/api/coverage/collect', { method: 'POST' })).json();
    // /collect 返回的是实时全量快照，增量视图和场景视图下都不能直接渲染
    if (mode === 'incremental' || viewScenario) {
      await refresh();
      return;
    }
    render(d);
    if (current) openFile(current);
  });
  document.getElementById('btnReset').addEventListener('click', async () => {
    await fetch('/api/coverage/reset', { method: 'POST' });
    prevStatus = {};
    await refresh();
  });

  // 覆盖率变化时由服务端主动推送，避免前端空轮询
  function connectWs() {
    const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws/coverage');
    ws.onmessage = ev => {
      // 场景视图看的是 stop 时已定格的数据，实时推送与它无关，重渲染只会把它冲掉
      if (viewScenario) return;
      // 推送内容是全量口径，增量视图下改为按当前口径重取
      if (mode === 'incremental') {
        refresh();
        return;
      }
      render(JSON.parse(ev.data));
      if (current) openFile(current);
    };
    ws.onclose = () => setTimeout(connectWs, 3000);
  }

  loadScenarios();
  loadSummary().then(d => {
    if (d && d.files.length) openFile(d.files[0].path);
  });
  connectWs();
</script>
</body>
</html>
