<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>代码实时染色平台</title>
<!-- 内联空图标：不给的话浏览器每次都去要 /favicon.ico，换来一条 404 -->
<link rel="icon" href="data:," />
<link rel="stylesheet" href="/vendor/element-plus.css" />
<!-- 深色主题只是一张变量表：本平台的 CSS 全走 --el-*，跟着它一起翻 -->
<link rel="stylesheet" href="/vendor/element-plus-dark.css" />
<link rel="stylesheet" href="/app.css" />
</head>
<body>
<div id="app"><div class="boot">加载中…</div></div>

<!-- vendor 是提交进仓库的 UMD 产物，不走 CDN：平台面向内网测试环境，不能假设有外网。
     CDN 拿不到的表现是「HTTP 200 的空白页」，是最难排查的一种坏法 -->
<script src="/vendor/vue.global.prod.js"></script>
<script src="/vendor/element-plus.full.min.js"></script>
<script src="/vendor/element-plus-icons.iife.min.js"></script>
<script>
  // 三个 vendor 少一个，下面的 ES module 就会以「Vue is not defined」静默失败，
  // 页面停在「加载中…」上不动。宁可把原因写在脸上
  if (!window.Vue || !window.ElementPlus || !window.ElementPlusIconsVue) {
    document.getElementById('app').innerHTML =
      '<div class="boot fail">前端依赖没能加载出来。<br>' +
      '请确认 static/vendor/ 下的三个 js 与 element-plus.css 都在，' +
      '且平台是从重新打包过的 jar 启动的（改过 static/ 之后要再跑一次 mvn package）。</div>';
  }
</script>
<script type="module" src="/app.js"></script>
</body>
</html>
